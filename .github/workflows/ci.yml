# Runs on every Pull Request targeting main: installs dependencies, builds,
# and runs tests. Never deploys — deployment only happens on push to main
# (see deploy.yml).

name: CI

on:
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Build App
        run: yarn build
        env:
          REACT_APP_ADSENSE_PUBLISHER_ID: ${{ vars.REACT_APP_ADSENSE_PUBLISHER_ID }}

      - name: Run tests
        run: yarn test --watchAll=false
